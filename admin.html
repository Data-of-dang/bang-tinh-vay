<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanEVD - Quản Trị Chính Sách</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; color: #222; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { font-size: 22px; margin-bottom: 20px; text-align: center; color: #111; }
        .section-box { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        h3 { font-size: 16px; margin-bottom: 15px; color: #0f766e; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #444; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; background: #fafafa;}
        input:focus, select:focus { border-color: #00a896; background: #fff;}
        
        .btn-save { width: 100%; padding: 14px; background: #0f766e; color: #fff; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s;}
        .btn-save:hover { background: #111; }
        
        #msg { text-align: center; font-weight: 600; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Trang Quản Trị Chính Sách</h2>

    <!-- FORM THÊM NGÂN HÀNG -->
    <div class="section-box">
        <h3>1. Thêm Ngân Hàng Mới</h3>
        <div class="form-group">
            <label>Tên Ngân Hàng</label>
            <input type="text" id="bank-name" placeholder="VD: Techcombank">
        </div>
        <div class="form-group">
            <label>Lãi suất ưu đãi (%)</label>
            <input type="text" id="bank-promo-rate" placeholder="VD: 6.5">
        </div>
        <div class="form-group">
            <label>Số tháng ưu đãi</label>
            <input type="number" id="bank-promo-months" placeholder="VD: 24">
        </div>
        <div class="form-group">
            <label>Lãi suất thả nổi (%)</label>
            <input type="text" id="bank-float-rate" placeholder="VD: 10.5">
        </div>
        <button class="btn-save" onclick="addBank()">LƯU NGÂN HÀNG</button>
    </div>

    <!-- FORM THÊM GÓI ƯU ĐÃI CĐT -->
    <div class="section-box" style="border: none; margin-bottom: 0;">
        <h3>2. Thêm Gói Ưu Đãi CĐT Mới</h3>
        <div class="form-group">
            <label>Tên Gói Ưu Đãi</label>
            <input type="text" id="promo-name" placeholder="VD: Ân hạn gốc 24 tháng">
        </div>
        <div class="form-group">
            <label>Loại ân hạn</label>
            <select id="promo-type">
                <option value="AN_HAN_GOC_LAI">Ân hạn cả Gốc và Lãi</option>
                <option value="AN_HAN_GOC">Chỉ ân hạn Gốc</option>
                <option value="KHONG_AN_HAN">Không ân hạn</option>
            </select>
        </div>
        <div class="form-group">
            <label>Số tháng ân hạn</label>
            <input type="number" id="promo-months" placeholder="VD: 24">
        </div>
        <div class="form-group">
            <label>Tiền mặt quà tặng trừ trực tiếp (Nếu có)</label>
            <input type="number" id="promo-cash" placeholder="VD: 50000000 (để 0 nếu không có)">
        </div>
        <button class="btn-save" style="background: #111;" onclick="addPromo()">LƯU GÓI ƯU ĐÃI</button>
    </div>

    <div id="msg"></div>
</div>

<script>
    // Dán link API Google Apps Script của mày vào đây
    const API_URL = "https://script.google.com/macros/s/AKfycbyYVEAnJ97M0SwKjZPhPE4NevXbKOEQTgEFTSrMuqXum1JTJoiyS0k7Dy1ycFPhtB9b5Q/exec";

    async function sendData(payload) {
        let msg = document.getElementById('msg');
        msg.style.color = "#00a896";
        msg.innerText = "Đang lưu lên hệ thống...";

        try {
            let response = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            let result = await response.json();
            if(result.status === "success") {
                msg.style.color = "#0f766e";
                msg.innerText = "Thêm thành công! Dữ liệu đã cập nhật vào Google Sheets.";
                setTimeout(() => { msg.innerText = ""; }, 4000);
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            msg.style.color = "#e11d48";
            msg.innerText = "Lỗi: " + error.message;
        }
    }

    function addBank() {
        let name = document.getElementById('bank-name').value.trim();
        let promoRate = document.getElementById('bank-promo-rate').value.trim();
        let promoMonths = document.getElementById('bank-promo-months').value.trim();
        let floatRate = document.getElementById('bank-float-rate').value.trim();

        if(!name) { alert("Vui lòng nhập tên ngân hàng!"); return; }

        sendData({
            type: "bank",
            Ten_Ngan_Hang: name,
            Lai_Uu_Dai: promoRate,
            So_Thang_Uu_Dai: promoMonths,
            Lai_Tha_Noi: floatRate
        });
    }

    function addPromo() {
        let name = document.getElementById('promo-name').value.trim();
        let type = document.getElementById('promo-type').value;
        let months = document.getElementById('promo-months').value.trim();
        let cash = document.getElementById('promo-cash').value.trim() || 0;

        if(!name) { alert("Vui lòng nhập tên gói ưu đãi!"); return; }

        sendData({
            type: "promo",
            Ten_Goi: name,
            Loai_An_Han: type,
            So_Thang_An_Han: months,
            Qua_Tang_Tien_Mat: cash
        });
    }
</script>
</body>
</html>
